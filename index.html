<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      모바일 우선: 초기 줌 1, 확대 차단 시도.
      주의: iOS Safari는 user-scalable=no 를 무시하므로(iOS 10+),
      더블탭 줌/탭 지연은 탭 대상 요소의 `touch-action: manipulation` 으로 잡는다.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f8fa" />

    <!-- SEO / 소셜 공유 미리보기. 값은 scripts/seo/site.js 와 동기(단일 URL 앱이라 정적).
         절대 URL 이어야 카톡/트위터/페북 미리보기가 뜬다. -->
    <title>영어 명언 행맨 — 놀면서 배우는 영어</title>
    <meta
      name="description"
      content="명언·여행·비즈니스·영화 영어 문장을 크립토그램 행맨으로 풀며 배우는 무료 게임. 한글 뜻과 함께, 모바일에서 바로 플레이."
    />
    <link rel="canonical" href="https://2602-hangman.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="영어 명언 행맨" />
    <meta property="og:title" content="영어 명언 행맨 — 놀면서 배우는 영어" />
    <meta
      property="og:description"
      content="명언·여행·비즈니스·영화 영어 문장을 행맨으로 풀며 배우는 무료 게임. 한글 뜻과 함께 모바일에서 바로 플레이."
    />
    <meta property="og:url" content="https://2602-hangman.vercel.app/" />
    <meta property="og:image" content="https://2602-hangman.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="영어 명언 행맨 — 놀면서 배우는 영어" />
    <meta
      name="twitter:description"
      content="명언·여행·비즈니스·영화 영어 문장을 행맨으로 풀며 배우는 무료 게임. 한글 뜻과 함께."
    />
    <meta name="twitter:image" content="https://2602-hangman.vercel.app/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
